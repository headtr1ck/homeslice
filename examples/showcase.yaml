# The demo house as the README, the showreel and the demo site show it (examples/demo.yaml
# is the browser tests' copy): doors between the rooms, a landing, u-turn stairs.
schema: 1
id: demo
name: Demo house
outline: { rect: [0, 0, 8, 10] }
party_walls: [east]
vertical:
  # a u-turn stair: up along the north side, round the winders, back to the landing
  - { id: stairs, rect: [5, 4, 3, 2], from: ground, to: first, shape: u_turn, up: east, start: north }
levels:
  - id: ground
    floor_id: ground_floor
    rooms:
      - { id: hall, area_id: hall, rect: [0, 0, 3, 4], floor: tile }
      - { id: kitchen, area_id: kitchen, rect: [3, 0, 5, 4], floor: tile }
      - id: living
        area_id: living_room
        polygon: [[0, 4], [5, 4], [5, 6], [8, 6], [8, 10], [0, 10]]
      - id: garden
        area_id: garden
        kind: outdoor
        rect: [0, 10, 8, 5]
        awning: cover.awning
        furniture:
          - { type: tree, at: [6.6, 3.4] }
          - { type: hedge, at: [4, 4.6], size: [7.6, 0.7] }
          - { type: flower_bed, at: [1.5, 3.6] }
          - { type: bench, at: [4.2, 3.7], rotation: 180 }
    openings:
      - { room: hall, side: north, at: 1, width: 1, type: door }
      - { room: kitchen, side: north, at: 1.5, width: 1.2, cover: cover.kitchen }
      - { room: living, side: south, at: 1, width: 2.4, cover: cover.living_room }
      - { room: living, side: south, at: 5, width: 1, type: door }
      - { room: living, side: west, at: 2, width: 1.5 }
      # inside: the hall to the kitchen and the living room, the kitchen to the living room
      - { room: hall, side: south, at: 1.2, width: 0.9, type: door }
      - { room: kitchen, side: west, at: 1.6, width: 0.9, type: door }
      - { room: kitchen, side: south, at: 0.6, width: 0.9, type: door }
  - id: first
    floor_id: first_floor
    rooms:
      - { id: bedroom, area_id: bedroom, rect: [0, 0, 5, 6] }
      - { id: bath, area_id: bathroom, rect: [5, 0, 3, 4], floor: tile }
      - { id: kids, area_id: kids_room, rect: [0, 6, 8, 4] }
      - { id: landing, name: Landing, rect: [5, 4, 3, 2] }
    openings:
      - { room: bedroom, side: north, at: 1, width: 2, cover: cover.bedroom }
      - { room: kids, side: south, at: 1, width: 2, cover: cover.kids }
      - { room: kids, side: south, at: 5, width: 2, cover: cover.kids }
      # from the landing to the bedroom, the bathroom and the kids' room
      - { room: landing, side: west, at: 1.0, width: 0.8, type: door }
      - { room: landing, side: north, at: 1.1, width: 0.8, type: door }
      - { room: landing, side: south, at: 1.1, width: 0.8, type: door }
robots:
  - entity: vacuum.robo
    level: ground
    dock: [0.8, 3.3]
    position:                          # optional: the live position, calibrated by two spots
      attribute: vacuum_position
      points:
        - [[25000, 25000], [1, 1]]
        - [[26000, 25000], [2, 1]]
