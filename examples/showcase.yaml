# The demo house as the README, the showreel and the demo site show it (examples/demo.yaml
# is the browser tests' copy): a front door, doors between the rooms, stairs up from the
# living room to a landing, a garage with a car, a garden. Furniture: scripts/demo-model.mjs.
schema: 1
id: demo
name: Demo house
outline: { rect: [0, 0, 8, 10] }
party_walls: [east]
vertical:
  # a u-turn stair: up along the north side, round the winders, back to the landing
  - { id: stairs, rect: [5, 4, 3, 2], from: ground, to: first, shape: u_turn, up: east, start: north }
levels:
  - id: ground
    floor_id: ground_floor
    # the ground floor reaches further west: the garage
    outline: { polygon: [[-3.4, 0], [8, 0], [8, 10], [0, 10], [0, 6], [-3.4, 6]] }
    rooms:
      - { id: hall, area_id: hall, rect: [0, 0, 3, 4], floor: tile }
      - { id: kitchen, area_id: kitchen, rect: [3, 0, 5, 4], floor: tile }
      - { id: living, area_id: living_room, rect: [0, 4, 8, 6] }
      - { id: garage, area_id: garage, rect: [-3.4, 0, 3.4, 6], floor: concrete }
      - id: garden
        area_id: garden
        kind: outdoor
        rect: [0, 10, 8, 5]
        awning: cover.awning
        furniture:
          - { type: tree, at: [6.6, 3.4] }
          - { type: hedge, at: [4, 4.6], size: [7.6, 0.7] }
          - { type: flower_bed, at: [1.5, 3.6] }
          - { type: bench, at: [4.2, 3.7], rotation: 180 }
      - { id: drive, area_id: garden, kind: outdoor, rect: [-3.4, 6, 3.4, 9], floor: paving }
    openings:
      - { room: hall, side: north, at: 1, width: 1, type: door, style: entrance_panes }
      - { room: kitchen, side: north, at: 1.5, width: 1.2, cover: cover.kitchen }
      - { room: living, side: south, at: 1, width: 2.4, cover: cover.living_room }
      - { room: living, side: south, at: 5, width: 1, type: door }
      - { room: living, side: west, at: 2, width: 1.5 }
      # inside: the hall to the living room and the garage, the kitchen to the hall and the living room
      - { room: hall, side: south, at: 0.3, width: 0.9, type: door }
      - { room: hall, side: west, at: 1.5, width: 0.9, type: door }
      - { room: kitchen, side: west, at: 1.6, width: 0.9, type: door }
      - { room: kitchen, side: south, at: 0.9, width: 0.9, type: door }
      # the garage door onto the drive, in front of the car
      - { room: garage, side: south, at: 0.4, width: 2.6, type: garage_door, cover: cover.garage }
  - id: first
    floor_id: first_floor
    rooms:
      - { id: bedroom, area_id: bedroom, rect: [0, 0, 4, 6] }
      - { id: bath, area_id: bathroom, rect: [4, 0, 4, 4], floor: tile }
      - { id: kids, area_id: kids_room, rect: [0, 6, 8, 4] }
      # the landing: floor in front of the stairwell, a door to every room
      - { id: landing, name: Landing, rect: [4, 4, 4, 2] }
    openings:
      - { room: bedroom, side: north, at: 1, width: 2, cover: cover.bedroom }
      - { room: kids, side: south, at: 1, width: 2, cover: cover.kids }
      - { room: kids, side: south, at: 5, width: 2, cover: cover.kids }
      - { room: bath, side: north, at: 2.6, width: 0.8 }
      - { room: landing, side: west, at: 0.6, width: 0.8, type: door }
      - { room: landing, side: north, at: 0.1, width: 0.8, type: door }
      - { room: landing, side: south, at: 0.1, width: 0.8, type: door }
robots:
  - entity: vacuum.robo
    level: ground
    dock: [0.8, 3.3]
    position:
      attribute: vacuum_position
      points:
        - [[25000, 25000], [1, 1]]
        - [[26000, 25000], [2, 1]]
