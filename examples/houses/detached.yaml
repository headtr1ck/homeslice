# A free-standing family house for the demo site: two floors under a hip roof with solar
# panels, a garage with a roof terrace over it, a terrace with an awning, a garden all round
# with a pool. Pieces without a size take the catalogue's (scripts/demo-model.mjs fills them in).
schema: 2
id: detached
name: Detached house
outline: { rect: [0, 0, 11, 8.5] }
facade: render_white
vertical:
  # up from the hall by the front door, arriving on the landing above the living room door
  - { id: stairs, rect: [4.1, 0.5, 1.0, 3.4], from: ground, to: first, up: south, entry: 0.6 }
levels:
  - id: ground
    floor_id: ground_floor
    # the garage reaches further east
    outline: { polygon: [[0, 0], [14.5, 0], [14.5, 6.5], [11, 6.5], [11, 8.5], [0, 8.5]] }
    rooms:
      - id: kitchen
        area_id: kitchen
        rect: [0, 0, 4, 4]
        floor: terrazzo
        wall: paint_sage
        furniture:
          - { type: kitchen, model: "modern:kitchen", at: [1.95, 0.67], size: [3.0, 0.62] }
          - { type: kitchen_upper, model: "modern:kitchen_hood", at: [2.6, 0.61] }
          - { type: fridge, model: "modern:kitchen_tall_fridge", at: [0.67, 1.35], rotation: 270 }
          - { type: kitchen, model: "modern:kitchen_island", at: [2.2, 2.4], size: [2.0, 0.95] }
          - { type: stool, model: "modern:bar_stool_back", at: [1.7, 3.3], rotation: 180 }
          - { type: stool, model: "modern:bar_stool_back", at: [2.7, 3.3], rotation: 180 }
          - { type: ceiling_lamp, model: "modern:pendant_globe", at: [1.7, 2.4], entity: light.kitchen_island }
          - { type: ceiling_lamp, model: "modern:pendant_globe", at: [2.7, 2.4], entity: light.kitchen_island }
      - id: hall
        area_id: hall
        rect: [4, 0, 3.5, 4]
        floor: tile_cement
        furniture:
          - { type: rug, model: "modern:rug_runner", at: [2.2, 2.2], size: [0.8, 2.2] }
          - { type: shelf, model: "modern:shoe_cabinet", at: [3.32, 1.87], rotation: 90 }
          - { type: item, model: "modern:coat_hooks", at: [3.0, 0.42] }
      - id: wc
        name: Guest WC
        area_id: guest_wc
        rect: [7.5, 0, 3.5, 1.8]
        floor: tile_white
        furniture:
          - { type: toilet, model: "modern:toilet_wall", at: [3.165, 1.05], rotation: 90 }
          - { type: sink, model: "modern:sink_wall_small", at: [1.6, 0.52] }
      - id: utility
        area_id: utility
        rect: [7.5, 1.8, 3.5, 2.2]
        floor: tile
        furniture:
          - { type: item, model: "modern:heat_pump_indoor", at: [1.2, 0.385] }
          - { type: shelf, model: "modern:shelving_metal", at: [2.4, 0.285] }
          - { type: washer, model: "modern:washer", at: [1.8, 1.84], rotation: 180, entity: sensor.washer_remaining }
          - { type: dryer, model: "modern:dryer", at: [2.4, 1.84], rotation: 180 }
      - id: living
        area_id: living_room
        rect: [0, 4, 11, 4.5]
        floor: oak_herringbone
        wall: paint_warm
        furniture:
          # dining by the kitchen: chairs on both long sides, facing the table
          - { type: table, model: "modern:dining_table", at: [2.2, 1.7] }
          - { type: chair, model: "modern:chair_shell", at: [1.75, 0.85] }
          - { type: chair, model: "modern:chair_shell", at: [2.65, 0.85] }
          - { type: chair, model: "modern:chair_shell", at: [1.75, 2.55], rotation: 180 }
          - { type: chair, model: "modern:chair_shell", at: [2.65, 2.55], rotation: 180 }
          - { type: ceiling_lamp, model: "modern:pendant_linear", at: [2.2, 1.7], entity: light.dining }
          # the sofa facing the TV on the north wall, the stove in the corner
          - { type: shelf, model: "modern:tv_board", at: [9.0, 0.26], size: [1.8, 0.4], height: 0.45 }
          - { type: tv, model: "modern:tv_wall", at: [9.0, 0.1], entity: media_player.living_room_tv }
          - { type: rug, model: "modern:rug_berber", at: [8.8, 1.6], size: [2.6, 1.9] }
          - { type: sofa_corner, model: "modern:sofa_corner", at: [8.8, 2.9], rotation: 180 }
          - { type: coffee_table, model: "modern:coffee_table_round", at: [8.8, 1.45] }
          - { type: floor_lamp, model: "modern:floor_lamp_globe", at: [7.1, 3.6], entity: light.reading_lamp }
          - { type: item, model: "modern:fireplace_stove", at: [10.715, 0.7], rotation: 90, entity: switch.fireplace }
          - { type: plant, model: "modern:fiddle_fig", at: [5.0, 0.45] }
      - id: garage
        area_id: garage
        rect: [11, 0, 3.5, 6.5]
        floor: concrete
        furniture:
          - { type: car, model: "modern:car_estate", at: [1.7, 3.3], finish: grey, entity: device_tracker.car, readings: [sensor.car_battery] }
          - { type: item, model: "modern:wallbox", at: [3.075, 1.6], rotation: 90, entity: sensor.wallbox_power }
      - id: terrace
        area_id: terrace
        kind: outdoor
        rect: [0, 8.5, 6, 3.5]
        floor: decking
        awning: cover.terrace_awning
        furniture:
          - { type: table, model: "modern:garden_table", at: [4.0, 1.9] }
          - { type: chair, model: "modern:garden_chair", at: [3.5, 1.05] }
          - { type: chair, model: "modern:garden_chair", at: [4.5, 1.05] }
          - { type: chair, model: "modern:garden_chair", at: [3.5, 2.75], rotation: 180 }
          - { type: chair, model: "modern:garden_chair", at: [4.5, 2.75], rotation: 180 }
          - { type: item, model: "modern:bbq_kettle", at: [0.6, 3.0] }
          - { type: plant, model: "modern:olive_tree", at: [5.6, 0.5] }
      # the garden round the house (at from its corner at [-3, 0])
      - id: garden
        area_id: garden
        kind: outdoor
        polygon: [[-3, 0], [0, 0], [0, 12], [6, 12], [6, 8.5], [11, 8.5], [11, 6.5], [14.5, 6.5], [14.5, 18], [-3, 18]]
        furniture:
          - { type: item, model: "modern:pool", at: [12.5, 11.5], entity: switch.pool_pump }
          - { type: item, model: "modern:sun_lounger", at: [15.8, 11.0] }
          - { type: item, model: "modern:sun_lounger", at: [16.7, 11.0] }
          - { type: tree, model: "modern:tree_deciduous", at: [2.5, 14.8] }
          - { type: tree_small, model: "modern:tree_fruit", at: [7.5, 15.6] }
          - { type: tree_small, model: "modern:tree_birch", at: [1.5, 2.0] }
          - { type: hedge, model: "modern:hedge_leafy", at: [8.75, 17.6], size: [17.4, 0.7] }
          - { type: item, model: "modern:garden_shed", at: [16.0, 15.8] }
          - { type: flower_bed, model: "modern:raised_bed", at: [6.5, 13.4] }
          - { type: item, model: "modern:sprinkler", at: [8.0, 14.0], entity: switch.sprinkler }
          - { type: floor_lamp, model: "modern:garden_light", at: [9.3, 9.0], entity: light.garden }
          - { type: floor_lamp, model: "modern:garden_light", at: [9.3, 11.8], entity: light.garden }
          - { type: floor_lamp, model: "modern:garden_light", at: [14.5, 8.8], entity: light.garden }
      - id: front
        name: Front garden
        area_id: front_garden
        kind: outdoor
        rect: [-3, -5, 14, 5]
        furniture:
          - { type: garden_path, model: "modern:path_paving", at: [9.0, 2.5], size: [1.2, 5] }
          - { type: item, model: "modern:mailbox_post", at: [10.2, 0.7], entity: binary_sensor.mailbox }
          - { type: pine, model: "modern:tree_conifer", at: [1.5, 2.0] }
          - { type: bush, model: "modern:hydrangea", at: [5.0, 4.2] }
          - { type: bush, model: "modern:hydrangea", at: [6.4, 4.2] }
          - { type: flower_bed, model: "modern:lavender", at: [3.5, 4.4] }
          - { type: floor_lamp, model: "modern:garden_light", at: [8.1, 3.8], entity: light.front_garden }
          - { type: floor_lamp, model: "modern:garden_light", at: [8.1, 1.6], entity: light.front_garden }
          - { type: item, model: "modern:wheelie_bins", at: [12.6, 4.4] }
      - { id: drive, area_id: front_garden, kind: outdoor, rect: [11, -5, 3.5, 5], floor: paving }
    walls:
      - { between: [kitchen, living] }   # open plan
    openings:
      - { room: hall, side: north, at: 1.5, width: 1.0, type: door, style: entrance_panes, lock: lock.front_door, contact: binary_sensor.front_door }
      - { room: hall, side: east, at: 0.55, width: 0.8, type: door }
      - { room: hall, side: east, at: 2.4, width: 0.8, type: door }
      - { room: hall, side: south, at: 2.3, width: 0.9, type: door }
      - { room: kitchen, side: north, at: 1.2, width: 1.2, sill: 1.05, height: 1.05, cover: cover.kitchen }
      - { room: kitchen, side: west, at: 2.2, width: 1.0 }
      - { room: wc, side: north, at: 2.2, width: 0.6, sill: 1.3, height: 0.7 }
      - { room: utility, side: east, at: 0.6, width: 0.9, type: door }
      - { room: living, side: south, at: 1.0, width: 2.4, type: door, style: sliding_glass, cover: cover.living_terrace, contact: binary_sensor.terrace_door }
      - { room: living, side: south, at: 6.2, width: 2.0, cover: cover.living_south }
      - { room: living, side: east, at: 2.9, width: 1.0 }
      - { room: living, side: west, at: 1.4, width: 1.6 }
      - { room: garage, side: north, at: 0.45, width: 2.6, type: garage_door, cover: cover.garage_door }
  - id: first
    floor_id: first_floor
    rooms:
      - id: ensuite
        area_id: ensuite
        rect: [0, 0, 4, 3.4]
        floor: tile_white
        wall: tile_zellige
        furniture:
          - { type: bathtub, model: "modern:bathtub", at: [1.26, 0.76] }
          - { type: shower, model: "modern:shower_glass", at: [3.34, 0.81] }
          - { type: sink, model: "modern:vanity_double", at: [0.595, 2.2], rotation: 270 }
          - { type: toilet, model: "modern:toilet_wall", at: [3.665, 1.9], rotation: 90 }
      - id: bedroom
        area_id: bedroom
        rect: [0, 3.4, 4, 5.1]
        floor: oak_light
        wall_sides: { west: acoustic_oak }
        furniture:
          - { type: bed, model: "modern:bed_upholstered", at: [1.435, 2.9], rotation: 270 }
          - { type: nightstand, model: "modern:nightstand", at: [0.55, 1.75], rotation: 270 }
          - { type: nightstand, model: "modern:nightstand", at: [0.55, 4.05], rotation: 270 }
          - { type: wardrobe, model: "modern:wardrobe_sliding", at: [3.615, 2.6], rotation: 90 }
          - { type: rug, model: "modern:rug_shaggy", at: [2.3, 2.9], size: [1.6, 2.4] }
          - { type: item, model: "modern:ac_split", at: [1.5, 0.19], elevation: 2.05, entity: climate.bedroom_ac }
      - id: landing
        area_id: landing
        rect: [4, 0, 3.5, 5.2]
        furniture:
          - { type: plant, model: "modern:olive_tree", at: [3.05, 0.7] }
      - id: office
        area_id: office
        rect: [4, 5.2, 3.5, 3.3]
        floor: oak_light
        furniture:
          - { type: desk, model: "modern:desk", at: [1.75, 2.59], rotation: 180 }
          - { type: chair, model: "modern:chair_office", at: [1.75, 1.9] }
          - { type: shelf, model: "modern:bookshelf_wide", at: [0.235, 1.5], rotation: 270 }
          - { type: sofa, model: "modern:daybed", at: [2.99, 1.6], rotation: 90 }
      - id: bath
        area_id: bathroom
        rect: [7.5, 0, 3.5, 2.8]
        floor: tile_white
        furniture:
          - { type: bathtub, model: "modern:bathtub_built_in", at: [2.24, 0.76] }
          - { type: sink, model: "modern:vanity", at: [1.6, 2.505], rotation: 180 }
          - { type: toilet, model: "modern:toilet_wall", at: [2.865, 2.0], rotation: 90 }
      - id: kids
        area_id: kids_room
        rect: [7.5, 2.8, 3.5, 5.7]
        floor: carpet
        wall: paint_blush
        furniture:
          - { type: bed_single, model: "modern:bed_single", at: [1.65, 1.085] }
          - { type: desk, model: "modern:desk", at: [1.0, 5.04], rotation: 180, size: [1.2, 0.6] }
          - { type: chair, model: "modern:chair_office", at: [1.0, 4.35] }
          - { type: item, model: "modern:toy_box", at: [2.93, 4.0], rotation: 90 }
          - { type: rug, model: "modern:rug_round", at: [1.7, 3.1] }
          - { type: armchair, model: "modern:bean_bag", at: [2.6, 4.95] }
          - { type: wardrobe, model: "modern:wardrobe_2door", at: [0.36, 2.5], rotation: 270 }
      # over the garage: a roof terrace with a railing, out from the kids' room
      - id: roof_terrace
        area_id: roof_terrace
        kind: outdoor
        rect: [11, 0, 3.5, 6.5]
        floor: decking
        railing: metal
        furniture:
          - { type: sofa, model: "modern:garden_sofa", at: [0.45, 1.6], rotation: 270 }
          - { type: item, model: "modern:sun_lounger", at: [2.5, 1.6] }
          - { type: table, model: "modern:bistro_set", at: [2.2, 4.0], rotation: 90 }
          - { type: plant, model: "modern:planter_tall", at: [3.0, 6.0] }
          - { type: item, model: "modern:lantern", at: [0.4, 3.0], entity: light.roof_terrace }
    openings:
      - { room: ensuite, side: north, at: 0.6, width: 1.2, sill: 1.1, height: 1.0 }
      - { room: ensuite, side: south, at: 2.9, width: 0.8, type: door }
      - { room: bedroom, side: east, at: 0.55, width: 0.8, type: door }
      - { room: bedroom, side: south, at: 1.0, width: 2.0, cover: cover.bedroom }
      - { room: landing, side: north, at: 1.6, width: 1.0 }
      - { room: office, side: north, at: 1.6, width: 0.8, type: door }
      - { room: office, side: south, at: 1.0, width: 1.5, cover: cover.office }
      - { room: bath, side: west, at: 1.0, width: 0.8, type: door }
      - { room: bath, side: north, at: 1.6, width: 1.0, sill: 1.1, height: 1.0 }
      - { room: kids, side: west, at: 0.6, width: 0.8, type: door }
      - { room: kids, side: east, at: 2.0, width: 0.9, type: door, style: glass }
      - { room: kids, side: south, at: 1.0, width: 1.5, cover: cover.kids_room }
  - id: roof
    kind: roof
    name: Roof
    rooms: []
    roofs:
      - id: main
        rect: [0, 0, 11, 8.5]
        shape: hip
        pitch: 30
        finish: roof_clay_dark
        furniture:
          - { type: item, model: "modern:solar_panel", at: [3.8, 6.6] }
          - { type: item, model: "modern:solar_panel", at: [4.95, 6.6] }
          - { type: item, model: "modern:solar_panel", at: [6.1, 6.6] }
          - { type: item, model: "modern:solar_panel", at: [7.25, 6.6] }
robots:
  - { entity: lawn_mower.mower, level: ground, dock: [12.5, 7.6] }
