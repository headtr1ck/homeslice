name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Browser tests
        run: |
          npx playwright-core install --with-deps chromium
          npm run test:browser
      # the library's pictures and sizes come from the code: render them again and fail
      # if a piece's picture is missing or Kenney sizes changed without being committed;
      # test-results/library.html shows every piece for review (in the screenshots artifact)
      - name: Furniture library pictures
        if: always()
        run: |
          node scripts/thumbnails.mjs
          git diff --exit-code -- frontend/editor/kenney-sizes.json
          if git status --porcelain --untracked-files=all assets | grep -E '^(\?\?| D)'; then
            echo "Pictures added or removed by scripts/thumbnails.mjs: run it and commit assets/"; exit 1
          fi
          node scripts/library-sheet.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python pytest-homeassistant-custom-component home-assistant-frontend
          .venv/bin/python -m pytest

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    # HACS can only validate public repositories
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # no icon in home-assistant/brands yet
          ignore: brands
