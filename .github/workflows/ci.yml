name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend – types, unit tests, library
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      # the library's pictures come from the code: render them again and fail if a
      # piece's picture is missing or was not committed;
      # test-results/library.html shows every piece for review (in the screenshots artifact)
      - name: Furniture library pictures
        if: always()
        run: |
          node scripts/thumbnails.mjs
          if git status --porcelain --untracked-files=all assets | grep -E '^(\?\?| D)'; then
            echo "Pictures added or removed by scripts/thumbnails.mjs: run it and commit assets/"; exit 1
          fi
          node scripts/library-sheet.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library
          path: test-results/

  # the browser tests (Playwright, tests/browser) in five groups of spec files, each its own job
  browser:
    name: Browser – ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, name: roofs, files: "demo-house-roof" }
          - { shard: 1, name: editor, files: "tests/browser/editor.spec" }
          - { shard: 2, name: "card: camera, energy, looks", files: "tests/browser/demo-house.spec demo-house-camera demo-house-energy demo-house-looks demo-house-white" }
          - { shard: 3, name: "card: views and modes", files: "demo-house-following demo-house-low demo-house-heatmap demo-house-all demo-house-lux demo-house-tilted demo-house-floor demo-house-german demo-house-phone demo-house-outdoor demo-house-per-level demo-house-narrow" }
          - { shard: 4, name: "editor: phone, drafts, new house", files: "editor-phone editor-unsaved editor-starting" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npx vite build
      - run: npx playwright test ${{ matrix.files }}
      # screenshots, and a report with traces of what failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/

  integration:
    name: Integration – Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python pytest-homeassistant-custom-component home-assistant-frontend
          .venv/bin/python -m pytest

  hassfest:
    name: Hassfest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    # HACS can only validate public repositories
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # no icon in home-assistant/brands yet
          ignore: brands
