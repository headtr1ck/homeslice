<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Homeslice test harness</title>
<link rel="icon" href="data:,">
<style>
  body { margin: 0; background: #111418; color: #e8eaed; font-family: Roboto, system-ui, sans-serif; }
  #root { width: 100%; max-width: 1600px; padding: 16px; box-sizing: border-box; }
</style>
<script>
  // minimal stand-ins for HA's own elements
  customElements.define("ha-card", class extends HTMLElement {
    connectedCallback() { this.style.display = "block"; }
  });
  customElements.define("ha-icon", class extends HTMLElement {
    static observedAttributes = ["icon"];
    attributeChangedCallback() {
      const name = (this.getAttribute("icon") || "").replace("mdi:", "");
      // the real icon where the page was given them (scripts/showcase.mjs), else its name
      const path = window.__icons?.[name];
      // in its shadow DOM, as HA's own does (children would confuse the templates it sits in)
      const root = this.shadowRoot ?? this.attachShadow({ mode: "open" });
      root.innerHTML = path ? `<svg viewBox="0 0 24 24" width="100%" height="100%" style="display:block;fill:currentColor"><path d="${path}"/></svg>` : `<span>${name}</span>`;
      this.style.cssText = path ? "display:inline-block;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px)" : "font-size:9px";
    }
  });
  // stand-in for HA's card helpers: renders entity name and state
  window.loadCardHelpers = async () => ({
    createCardElement(config) {
      const el = document.createElement("div");
      el.className = "fake-card";
      el.dataset.type = config.type;
      el.style.cssText = "border:1px solid #444;border-radius:12px;padding:8px;min-height:40px";
      Object.defineProperty(el, "hass", {
        set(h) {
          const s = h.states[config.entity];
          el.textContent = `${config.type} ${config.entity ?? ""} ${s ? s.state : ""}`;
        },
      });
      return el;
    },
  });
</script>
<script type="module" src="/custom_components/homeslice/frontend/homeslice-app.js"></script>
<script type="module" src="/custom_components/homeslice/frontend/homeslice-editor.js"></script>
</head>
<body>
<div id="root"></div>
<script type="module">
  import { makeHass } from "/dev/fake-hass.js";
  window.setup = async (fixture, config = {}) => {
    await customElements.whenDefined("homeslice-card");
    const card = document.createElement("homeslice-card");
    card.setConfig({ type: "custom:homeslice-card", ...config });
    const rendered = new Promise((r) => card.addEventListener("homeslice-rendered", r, { once: true }));
    document.getElementById("root").append(card);
    card.hass = makeHass(fixture, (h) => (card.hass = h));
    window.card = card;
    await rendered;
  };
  window.setupCardEditor = async (fixture, config) => {
    await customElements.whenDefined("homeslice-card-editor");
    const editor = document.createElement("homeslice-card-editor");
    editor.style.cssText = "display:flex;width:500px";
    window.editorConfigs = [];
    editor.addEventListener("config-changed", (e) => window.editorConfigs.push(e.detail.config));
    editor.setConfig(config);
    document.getElementById("root").append(editor);
    editor.hass = makeHass(fixture, (h) => (editor.hass = h));
    window.cardEditor = editor;
  };
  window.setupPanel = async (fixture, options = {}) => {
    await customElements.whenDefined("homeslice-panel");
    document.getElementById("root").style.cssText = "width:100vw;height:100vh;padding:0";
    const panel = document.createElement("homeslice-panel");
    panel.narrow = !!options.narrow;
    panel.style.cssText = "display:flex;height:100vh";
    document.getElementById("root").append(panel);
    panel.hass = makeHass(fixture, (h) => (panel.hass = h));
    window.panel = panel;
    await new Promise((r) => {
      const wait = () => (panel.shadowRoot?.querySelector(fixture.model ? "svg.plan .room" : ".empty button") ? r() : setTimeout(wait, 50));
      wait();
    });
  };
  window.ready = true;
  // opened by hand (npm run dev): ?demo=card or ?demo=editor shows the demo house
  const demo = new URLSearchParams(location.search).get("demo");
  if (demo) {
    const fixture = await (await fetch("/dev/fixtures/demo-hass.json")).json();
    if (demo === "editor") await window.setupPanel(fixture);
    else await window.setup(fixture, { interactive: true });
  }
</script>
</body>
</html>
